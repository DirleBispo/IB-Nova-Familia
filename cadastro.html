<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f55b5"><title>Cadastro de membro | IB Nova Família</title><link rel="stylesheet" href="styles.css"><style>body{background:#f4f7fb}.signup-wrap{max-width:620px;margin:40px auto;padding:20px}.signup-card{background:#fff;border:1px solid #dce5f0;border-radius:28px;padding:28px;box-shadow:0 18px 50px rgba(15,85,181,.08)}.signup-brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}.signup-brand img{width:68px;height:68px;border-radius:18px}.signup-brand small,.signup-card p{color:#667085}.signup-card h1{margin:4px 0}.signup-card label{display:block;font-weight:700;margin:14px 0 6px}.signup-card input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ccd6e3;border-radius:12px;font:inherit}.signup-card button{width:100%;margin-top:20px}.feedback{margin-top:16px}.back{display:block;text-align:center;margin-top:18px;color:#0f55b5;text-decoration:none}</style></head><body><main class="signup-wrap"><section class="signup-card"><div class="signup-brand"><img src="photo_5143638454599093943_y.jpg" alt="Logo IB Nova Família"><div><small>Igreja Batista</small><h1>Nova Família</h1></div></div><h2>Cadastro de membro</h2><p>Crie seu acesso ao aplicativo. O cadastro inicial é feito como membro e a liderança poderá liberar outras áreas quando necessário.</p><form id="signupForm"><label>Nome completo</label><input name="nome" autocomplete="name" required><label>Telefone / WhatsApp</label><input name="telefone" type="tel" autocomplete="tel" required><label>E-mail</label><input name="email" type="email" autocomplete="email" required><label>Senha</label><input name="senha" type="password" minlength="6" autocomplete="new-password" required><label>Confirmar senha</label><input name="confirmar" type="password" minlength="6" autocomplete="new-password" required><button class="primary" type="submit">Criar meu cadastro</button></form><div id="feedback" class="feedback"></div><a class="back" href="/">← Voltar para o aplicativo</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="cadastro.js"></script></body></html>
